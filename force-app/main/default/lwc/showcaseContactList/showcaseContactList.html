<template>
  <lightning-card>
    <template if:true={errorMessage}>
      <div
        class="slds-p-horizontal_medium slds-p-bottom_medium slds-text-color_error"
      >
        {errorMessage}
      </div>
    </template>

    <template if:true={hasContacts}>
      <lightning-datatable
        key-field="contactId"
        data={contacts}
        columns={columns}
        hide-checkbox-column
      ></lightning-datatable>

      <template if:true={showPagination}>
        <div
          class="slds-var-p-around_small slds-grid slds-grid_align-center slds-grid_vertical-align-center"
        >
          <lightning-button
            label="Previous"
            onclick={handlePrevious}
            disabled={isPreviousDisabled}
          ></lightning-button>
          <span class="slds-var-m-horizontal_small">{paginationLabel}</span>
          <lightning-button
            label="Next"
            onclick={handleNext}
            disabled={isNextDisabled}
          ></lightning-button>
        </div>
      </template>
    </template>

    <template if:false={hasContacts}>
      <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
        No contacts available yet.
      </div>
    </template>
  </lightning-card>
</template>
